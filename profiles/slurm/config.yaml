# ============================================================================
# profiles/slurm/config.yaml — Snakemake SLURM cluster profile
#
# Used when running:
#   snakemake --profile profiles/slurm --jobs 29 all
#
# Snakemake submits each rule invocation as an individual SLURM job.
# Resources are taken from each rule's `resources:` block.
#
# Compatible with Snakemake 7.x (`--cluster` flag).
# For Snakemake ≥ 8 with the official SLURM executor plugin, see:
#   https://snakemake.github.io/snakemake-plugin-catalog/plugins/executor/slurm.html
# ============================================================================

# SLURM submission command.  Wildcards like {wildcards.region} are expanded
# by Snakemake before passing to sbatch.
cluster: >-
  sbatch
  --parsable
  --job-name=lm-{rule}
  --output=logs/snakemake/{rule}_%j.out
  --error=logs/snakemake/{rule}_%j.err
  --time={resources.runtime}
  --nodes=1
  --ntasks=1
  --cpus-per-task={threads}
  --mem={resources.mem_mb}M
  --partition=serc

# Maximum number of simultaneously running jobs (one per region for run_ga)
jobs: 29

# Wait this many seconds for output files to appear after a job finishes.
# Set generously because Sherlock's filesystem can be slow.
latency-wait: 120

# Rerun incomplete (e.g. killed) jobs automatically.
rerun-incomplete: true

# Echo the shell command for each rule to the log.
printshellcmds: true

# Default resources for rules that do not declare their own.
default-resources:
  - mem_mb=8000
  - runtime=120
  - threads=1
